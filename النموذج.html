<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المرجع السعودي للأجور</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Visual system: one Arabic face (IBM Plex Sans Arabic), 16px body, 14–15px tables and labels, 22–26px titles,
   44px controls, 1.6 line height. Values are always isolated left-to-right so dates and ranges never flip. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --sunk:#eaf0ec; --ink:#0f1c16; --ink2:#2b3a33; --muted:#4d5f56; --line:#d3ddd7; --line2:#bccac2;
  --accent:#0b6247; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --ok:#17663b; --ok-soft:#ddf1e4; --warn:#8a4f00; --warn-soft:#fbecd5; --pend:#8f3d0f; --pend-soft:#fbe3d4;
  --bad:#a3231b; --bad-soft:#fbe2df; --info:#1a568c; --info-soft:#e0ebf7;
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:12px; --ctl:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1210; --surface:#151e1a; --sunk:#1c2723; --ink:#f0f6f2; --ink2:#dbe6e0; --muted:#b7c7be; --line:#2f3d37; --line2:#425249;
  --accent:#5fd3a3; --accent-ink:#06130e; --accent-soft:#183a2c;
  --ok:#7fe0a7; --ok-soft:#163626; --warn:#ffc46b; --warn-soft:#3a2b10; --pend:#ffab7a; --pend-soft:#3d2216;
  --bad:#ff9d93; --bad-soft:#40201c; --info:#9cc8f5; --info-soft:#17293d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#151e1a; --sunk:#1c2723; --ink:#f0f6f2; --ink2:#dbe6e0; --muted:#b7c7be; --line:#2f3d37; --line2:#425249;
  --accent:#5fd3a3; --accent-ink:#06130e; --accent-soft:#183a2c;
  --ok:#7fe0a7; --ok-soft:#163626; --warn:#ffc46b; --warn-soft:#3a2b10; --pend:#ffab7a; --pend-soft:#3d2216;
  --bad:#ff9d93; --bad-soft:#40201c; --info:#9cc8f5; --info-soft:#17293d; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
h1,h2,h3{font-weight:700;margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:24px} h2{font-size:20px} h3{font-size:17px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.v{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.wrap{max-width:1680px;margin:0 auto}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand h1{font-size:24px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.cobar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cobar label{font-size:14px;color:var(--muted)}
.cobar select{min-height:var(--ctl);min-width:260px;max-width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px}
.iconbtn{min-height:var(--ctl);min-width:var(--ctl);border:1px solid var(--line2);border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:15px;font-weight:600}
.match{min-height:36px;border-radius:999px;border:1px solid transparent;padding:0 14px;font-size:14px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.match.bad{background:var(--bad-soft);color:var(--bad)}
.notice{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:15px;font-weight:500}
nav.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:max-content;gap:4px;margin-top:10px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;color:var(--muted);font-weight:600;font-size:16px;min-height:var(--ctl)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .s{display:none}
@media (max-width:640px){
  nav.tabs{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-columns:auto}
  nav.tabs button{padding:8px 4px;font-size:15px} nav.tabs .l{display:none} nav.tabs .s{display:inline}
  .cobar select{min-width:0;flex:1 1 200px}
}
main{padding-top:18px}
/* panels and type */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel > h2,.panel > h3{margin-bottom:12px}
.hint{font-size:14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.4}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-pend{background:var(--pend-soft);color:var(--pend)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--info-soft);color:var(--info)} .b-mute{background:var(--sunk);color:var(--muted)}
.btn{min-height:var(--ctl);border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:0 16px;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
/* employee tab */
.emp{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.emp .result{position:sticky;top:var(--hh,170px);max-height:calc(100vh - var(--hh,170px) - 16px);overflow:auto}
.emp .listp{position:sticky;top:var(--hh,170px)}
.mstep{display:none}
@media (max-width:1240px){
  .emp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .emp .listp{grid-column:1 / -1;position:static}
  .emp .result{position:static;max-height:none}
  .emplist{max-height:260px}
}
@media (max-width:820px){
  .emp{grid-template-columns:minmax(0,1fr)}
  .mstep{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
  .mstep button{min-height:var(--ctl);border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-weight:600;font-size:15px}
  .mstep button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .emp[data-step="list"] > :not(.listp),.emp[data-step="form"] > :not(.formp),.emp[data-step="result"] > :not(.result){display:none}
  .emplist{max-height:none}
}
.search{width:100%;min-height:var(--ctl);border:1px solid var(--line2);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;margin-bottom:10px}
.emplist{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - var(--hh,170px) - 150px);overflow:auto}
.emplist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:right;border:1px solid transparent;background:none;padding:10px 12px;border-radius:10px;width:100%}
.emplist button:hover{background:var(--sunk)}
.emplist button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.emplist .nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.emplist .c{font-size:14px;color:var(--muted);grid-column:1}
.emplist .t{grid-row:1 / span 2;grid-column:2;font-size:15px;font-weight:600}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:700;font-size:17px;color:var(--ink);margin-bottom:10px;padding:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:500;min-width:0}
label.f .lt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
label.f .need{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 8px}
label.f input,label.f select{min-height:var(--ctl);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:0 12px;color:var(--ink);font-size:16px;font-weight:500;width:100%;min-width:0}
label.f input.num,label.f input.date{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
label.f input.invalid{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
label.f small{font-size:13px;color:var(--muted);font-weight:400}
details.adv{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:18px}
details.adv summary{cursor:pointer;min-height:var(--ctl);display:flex;align-items:center;font-weight:600;color:var(--accent)}
details.adv[open]{padding-bottom:14px}
/* result */
.summary{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
.summary .box{background:var(--sunk);border-radius:10px;padding:12px 14px;min-width:0}
.summary .k{font-size:14px;color:var(--muted)}
.summary .big{font-size:28px;font-weight:700;line-height:1.3}
.summary .mid{font-size:20px;font-weight:700;line-height:1.3}
@media (max-width:520px){.summary{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .summary .box:first-child{grid-column:1 / -1}}
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:520px){.status{grid-template-columns:minmax(0,1fr)}}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);min-width:0;display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:14px;color:var(--muted);font-weight:600}
.stat .val{font-size:17px;font-weight:600;color:var(--ink)}
.sec{margin:20px 0 10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
td.n,th.n{text-align:left}
tr.total td{font-weight:700;font-size:17px;border-top:2px solid var(--ink2)}
tr.sub td{color:var(--muted);font-size:14px}
.tbl{overflow-x:auto}
.why{border:0;background:none;color:var(--info);font-size:14px;padding:4px 6px;border-radius:6px;font-weight:600}
.why:hover{background:var(--info-soft)}
tr.detail td{background:var(--sunk);font-size:14px;color:var(--ink2)}
.srcbox{display:flex;flex-direction:column;gap:8px}
.srcbox a{color:var(--info);overflow-wrap:anywhere}
.srcline{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.alerts li .badge{flex:none}
.alerts button.go{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%}
.alerts button.go:focus-visible{outline:3px solid var(--accent)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.kpi .k{font-size:15px;color:var(--muted);font-weight:600}
.kpi .val{font-size:28px;font-weight:700;line-height:1.35}
.kpi .s{font-size:14px;color:var(--ink2);margin-top:4px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px}
@media (max-width:1000px){.cols2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{min-height:38px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);padding:0 14px;font-size:14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.empty{color:var(--muted);padding:24px;text-align:center}
/* rules */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tools .search{margin:0;flex:1 1 260px}
td.code{font-size:12px;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap}
td.rule{font-weight:500;min-width:260px}
td.src{font-size:14px;max-width:280px}
td.src a{color:var(--info)}
tr.hl td{background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top" id="hdr">
  <div class="hrow">
    <div class="brand"><h1>المرجع السعودي للأجور</h1><p>الأجور والتعويضات والامتثال الوظيفي – نموذج أولي</p></div>
    <div class="cobar">
      <label for="co">المنشأة</label>
      <select id="co"></select>
      <span class="hint" id="calcInfo"></span>
      <button class="match" id="matchBtn" type="button"></button>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="تبديل الوضع الفاتح والداكن"></button>
    </div>
  </div>
  <p class="notice">بيانات وهمية للتجربة، وتُحفظ في هذا المتصفح فقط. لا تُدخل بيانات موظفين حقيقيين.</p>
  <nav class="tabs" role="tablist" aria-label="أقسام">
    <button role="tab" id="t-emp" data-tab="emp"><span class="l">الموظف</span><span class="s">الموظف</span></button>
    <button role="tab" id="t-dash" data-tab="dash"><span class="l">لوحة المنشأة</span><span class="s">اللوحة</span></button>
    <button role="tab" id="t-set" data-tab="set"><span class="l">إعدادات المنشأة</span><span class="s">الإعدادات</span></button>
    <button role="tab" id="t-rules" data-tab="rules"><span class="l">الأحكام والمصادر</span><span class="s">الأحكام</span></button>
  </nav>
</header>

<main>
<section id="p-emp">
  <div class="mstep" role="group" aria-label="خطوات">
    <button data-step="list">١ الموظفون</button><button data-step="form">٢ البيانات</button><button data-step="result">٣ النتيجة</button>
  </div>
  <div class="emp" id="empGrid">
    <aside class="panel listp">
      <div class="row between" style="margin-bottom:10px"><h2>الموظفون</h2><button class="btn primary" id="addEmp" type="button">+ موظف</button></div>
      <input class="search" id="empSearch" type="search" placeholder="بحث بالاسم أو الفئة" aria-label="بحث في الموظفين">
      <div class="emplist" id="empList"></div>
    </aside>
    <div class="panel formp" id="formPanel"></div>
    <div class="panel result" id="resultPanel"></div>
  </div>
</section>
<section id="p-dash" hidden></section>
<section id="p-set" hidden></section>
<section id="p-rules" hidden></section>
<section id="p-check" hidden></section>
</main>
</div>

<script>
/*ENGINE-START*/
// Calculation engine: a port of the reference workbook's independent model (محرك/verify.py), which the workbook's tests match.
var ENGINE = (function () {
  var ST = { CONF: "مؤكد رسميًا", PART: "مؤكد جزئيًا", SEC: "مرجّح – مصدر ثانوي", PEND: "بانتظار التحقق الرسمي", NEED: "يحتاج تحقق" };
  var SRC = {
    S01: ["رفع الحد الأدنى لاحتساب أجور السعوديين في نطاقات", "وزارة الموارد البشرية", "https://www.hrsd.gov.sa/media-center/news/777585"],
    S07: ["إعفاء المنشآت الصغيرة من المقابل المالي (نقلًا عن قوى)", "مصدر مساند", "https://wazeftysa.com/blog/will-the-small-business-work-permit-exemption-be-extended-past-2027"],
    S08: ["منصة قوى – بيانات المنشأة ونطاقات ورموز المهن", "وزارة الموارد البشرية", "https://www.qiwa.sa"],
    S23: ["رحلة المنشأة في نظام التأمينات الاجتماعية الجديد", "التأمينات الاجتماعية", "https://awareness.gosi.gov.sa/businessJourney.html"],
    S24: ["المرسوم الملكي م/273 – نظام التأمينات الاجتماعية الجديد", "أم القرى", "https://uqn.gov.sa/details?p=25238"],
    S25: ["احتساب نسب التوطين من العقود الموثقة في قوى من 15 أبريل 2026", "وزارة الموارد البشرية", "https://www.hrsd.gov.sa/node/5580136"],
    S26: ["نظام العمل – الإشعار والمكافأة والاستقالة", "وزارة الموارد البشرية", "https://www.hrsd.gov.sa/node/5576001"],
    S27: ["نظام العمل – التعريفات (الأجر الأساسي والفعلي)", "وزارة الموارد البشرية", "https://www.hrsd.gov.sa/node/5575978"],
    S28: ["دليل برنامج نطاقات المطوّر 2026", "وزارة الموارد البشرية", "https://www.hrsd.gov.sa/sites/default/files/2026-03/ntaqat-almtwr.pdf"],
    S29: ["إلغاء المقابل المالي عن المنشآت الصناعية المرخصة", "مصدر مساند", "https://www.eyeofriyadh.com"],
    S32: ["المشتركون السعوديون ومد الحماية التأمينية لمواطني دول المجلس", "التأمينات الاجتماعية", "https://www.gosi.gov.sa/GOSIOnline/Saudi_Workers"],
    S34: ["الأسئلة الشائعة لأصحاب العمل (س72: أجر العمولة = متوسط السنة السابقة)", "التأمينات الاجتماعية", "https://www.gosi.gov.sa/GOSIOnline/FAQ_Employer"],
    S35: ["ما هو برنامج نطاقات وكيف يتم حسابه؟ (صفحة قوى، آخر تعديل 2026-10-09)", "قوى", "https://www.qiwa.sa"],
    S36: ["الإعفاء من المقابل المالي للفئات الخاصة (قائمة الوزارة 2018 وحاسبة قوى)", "مصادر مساندة نقلًا عن الوزارة وقوى", ""]
  };
  // id: [title, value or null, unit, status, source, reference, domain]
  var RULES = {
    "NIT-FULL": ["حد احتساب السعودي عاملًا كاملًا (الأجر المسجل)", 4000, "ريال/شهر", ST.CONF, "S01", "قرار وزاري 1442", "نطاقات"],
    "NIT-HALF": ["حد احتساب السعودي نصف عامل", 3000, "ريال/شهر", ST.CONF, "S01", "قرار وزاري 1442", "نطاقات"],
    "NIT-PT": ["وزن السعودي بدوام جزئي (بأجر 3,000 فأكثر)", 0.5, "عامل", ST.SEC, "S01", "قواعد نطاقات", "نطاقات"],

      '<div class="tbl"><table><thead><tr><th>الفئة</th><th>الحالة</th><th>التأمينات</th><th>نطاقات</th><th>المقابل المالي</th><th>المهن المقصورة على السعوديين</th></tr></thead><tbody>';
    E.CATS.forEach(function (c) {
      var lv = c[5] ? (E.LEVY_PENDING.indexOf(c[0]) >= 0 ? "محمّل (الإعفاء غير مثبت)" : "محمّل") : c[0] === "سعودي" ? "لا ينطبق" : "لا ينطبق (لا إقامة)";
      h += '<tr class="' + (c[0] === selCat ? "hl" : "") + '"><td>' + esc(c[0]) + "</td><td>" + stBadge(c[10]) + "</td><td>" + (c[1] ? "معاشات + ساند + أخطار" : c[0] === "مواطن خليجي" ? "دولة الموطن + أخطار" : "أخطار 2%") + "</td><td>" + esc(c[11]) + "</td><td>" + lv + "</td><td>" + esc(c[12]) + "</td></tr>";
    });
    p.innerHTML = h + "</tbody></table></div></div>";
    $("ruleQ").addEventListener("input", function (e) { ui.ruleQ = e.target.value.trim(); ruleRows(); });
    p.querySelectorAll("[data-d]").forEach(function (b) { b.addEventListener("click", function () { ui.ruleDom = b.dataset.d; renderRules(); }); });
    p.querySelectorAll("[data-s]").forEach(function (b) { b.addEventListener("click", function () { ui.ruleSt = b.dataset.s; renderRules(); }); });
    ruleRows();
  }
  function ruleRows() {
    var q = ui.ruleQ, rows = Object.keys(E.RULES).filter(function (id) {
      var r = E.RULES[id];
      return (ui.ruleDom === "الكل" || r[6] === ui.ruleDom) && (ui.ruleSt === "الكل" || r[3] === ui.ruleSt) && (!q || r[0].indexOf(q) >= 0 || id.indexOf(q.toUpperCase()) >= 0);
    });
    $("ruleBody").innerHTML = rows.length ? rows.map(function (id) {
      var r = E.RULES[id], s = E.SRC[r[4]];
      return '<tr><td class="rule">' + esc(r[0]) + '</td><td class="n">' + (r[1] === null ? "—" : V(String(r[1])) + " " + esc(r[2])) + "</td><td>" + stBadge(r[3]) + '</td><td class="src">' +
        (s ? (s[2] ? '<a href="' + esc(s[2]) + '" target="_blank" rel="noopener">' + esc(s[0]) + "</a>" : esc(s[0])) : "سياسة المنشأة") + '</td><td class="code">' + id + "</td></tr>";
    }).join("") : '<tr><td colspan="5" class="empty">لا أحكام مطابقة.</td></tr>';
  }

  // ---------- Excel match
  var FIELDS = { contrib: "الأجر الخاضع", er: "اشتراك المنشأة", ee: "استقطاع الموظف", levy: "المقابل المالي", gov: "الإقامة والرخصة", med: "الطبي", hk: "السكن العيني", tk: "النقل العيني",
    eosb: "أساس المكافأة", eos: "مخصص المكافأة", eosbal: "الالتزام المتراكم", leave: "مخصص الإجازة", ticket: "التذكرة", total: "إجمالي التكلفة", unc: "منها تقديري", nitw: "وزن نطاقات",
    nit: "محتسب مؤكد", nitpend: "توثيق غير معروف", nitno: "غير موثق", nitspec: "فئة خاصة قبل الحد", nitopt: "سيناريو دون حد", expn: "وافد مؤثر", commgap: "فرق العمولة", f_gcc: "خليجي غير مكتمل" };
  var DFIELDS = { total: "إجمالي التكلفة", unc: "منها تقديري", nit: "سعوديون محتسبون", spec: "فئات خاصة – الأدنى", spec_hi: "فئات خاصة – الأعلى", exp: "الوافدون المؤثرون",
    exp_lo: "الوافدون – الحد الأدنى", ratio_lo: "النسبة الدنيا", ratio_hi: "النسبة العليا", ratio_opt: "سيناريو دون حد", ratio_cons: "السيناريو المتحفظ", levy_saving: "وفر المقابل المالي المحتمل" };
  var checkCache = null;
  function runCheck() {
    if (checkCache) return checkCache;
    var rows = [], cells = 0, bad = [];
    SEED.companies.forEach(function (c0) {
      var res = E.computeCompany(clone(c0)), n = 0, b = 0, dn = 0, db = 0;
      Object.keys(c0.expected).forEach(function (code) {
        var ex = c0.expected[code], got = res.emps[code];
        Object.keys(FIELDS).forEach(function (k) {
          if (ex[k] === null || ex[k] === undefined) return;
          n++; var g = got ? got[k] : NaN;
          if (!(Math.abs((g || 0) - (ex[k] || 0)) <= 0.011)) { b++; bad.push([c0.name, code, FIELDS[k], g, ex[k]]); }
        });
      });
      if (c0.expectedDash) Object.keys(DFIELDS).forEach(function (k) {
        if (c0.expectedDash[k] === undefined) return;
        dn++; var g = res.dash[k], ex = c0.expectedDash[k];
        if (!(Math.abs(g - ex) <= (k.indexOf("ratio") === 0 || k.indexOf("spec") === 0 || k.indexOf("exp") === 0 ? 1e-9 : 0.011))) { db++; bad.push([c0.name, "اللوحة", DFIELDS[k], g, ex]); }
      });
      cells += n + dn;
      rows.push([c0.name, Object.keys(c0.expected).length, n, b, dn, db, c0.testOnly]);
    });
    checkCache = { rows: rows, cells: cells, bad: bad };
    return checkCache;
  }
  function renderCheck() {
    var r = runCheck(), ok = !r.bad.length;
    var h = '<div class="panel"><div class="row between"><h2>مطابقة نتائج الويب مع ملف Excel</h2><span class="badge ' + (ok ? "b-ok" : "b-bad") + '">' + (ok ? "مطابق: " + r.cells + " قيمة" : r.bad.length + " فرق") + "</span></div>" +
      '<p class="hint">يعيد المتصفح حساب البيانات الوهمية الأصلية بمحرك الويب، ويقارن كل قيمة بما حسبه ملف Excel بعد إعادة الحساب. الفرق المسموح أقل من هللة في المبالغ، وصفر في النسب والأعداد. منشآت «اختبار أحجام» لا تظهر في الشاشات؛ وُضعت لاختبار حدود الفئات الخاصة على أحجام مختلفة. تعديلاتك لا تدخل هذه المقارنة.</p>' +
      '<div class="tbl"><table><thead><tr><th>المنشأة</th><th class="n">الموظفون</th><th class="n">قيم الموظفين</th><th class="n">فروق</th><th class="n">قيم اللوحة</th><th class="n">فروق</th></tr></thead><tbody>' +
      r.rows.map(function (x) { return "<tr><td>" + esc(x[0]) + '</td><td class="n">' + V(x[1]) + '</td><td class="n">' + V(x[2]) + '</td><td class="n ' + (x[3] ? "bad" : "ok") + '">' + V(x[3]) + '</td><td class="n">' + (x[4] ? V(x[4]) : "لا تُقارن*") + '</td><td class="n ' + (x[5] ? "bad" : "ok") + '">' + (x[4] ? V(x[5]) : "—") + "</td></tr>"; }).join("") +
      '</tbody></table></div><p class="note">* لوحة «متاجر الواحة» لا تُقارن: ملف Excel المحسوب يعرض لوحة منشأة أخرى، فلم تُستخرج قيم لوحتها. قيم موظفيها كلها مقارنة.</p>';
    if (r.bad.length) h += '<h3 class="sec">الفروق</h3><div class="tbl"><table><thead><tr><th>المنشأة</th><th>الموظف</th><th>الحقل</th><th class="n">الويب</th><th class="n">Excel</th></tr></thead><tbody>' + r.bad.map(function (x) { return "<tr><td>" + esc(x[0]) + "</td><td>" + esc(x[1]) + "</td><td>" + esc(x[2]) + '</td><td class="n">' + V(x[3]) + '</td><td class="n">' + V(x[4]) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    $("p-check").innerHTML = h + '<div class="row" style="margin-top:14px"><button class="btn" id="backFromCheck" type="button">رجوع</button></div></div>';
    $("backFromCheck").addEventListener("click", function () { state.tab = "dash"; render(); });
  }

  // ---------- render
  var lastRes = null;
  function renderLive() { lastRes = E.computeCompany(co()); renderEmpList(lastRes); renderResult(lastRes); save(); }
  function renderAll() { lastRes = E.computeCompany(co()); renderEmpList(lastRes); renderForm(); renderResult(lastRes); renderStep(); save(); }
  function render() {
    if (state.coIdx >= state.companies.length) state.coIdx = 0;
    renderHeader(); renderTabs();
    if (state.tab === "emp") renderAll();
    else if (state.tab === "dash") { renderDash(E.computeCompany(co())); save(); }
    else if (state.tab === "set") { renderSettings(); save(); }
    else if (state.tab === "rules") renderRules();
    else renderCheck();
  }
  window.addEventListener("resize", function () { document.documentElement.style.setProperty("--hh", ($("hdr").offsetHeight + 12) + "px"); });
  render();
})();
</script>
</body>
</html>
